{% extends "base.html" %}
{% block title %}Register — PocketSmart AI{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Save plans, reuse recommendations and pick up where you left off.</p>
    <div class="form-error" id="formError" hidden></div>
    <form id="registerForm" class="form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="100" autocomplete="new-password" />
        <small class="form-hint">At least 8 characters.</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        <span class="btn-label">Create Account</span>
        <span class="spinner" hidden></span>
      </button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  initAuthForm({
    formId: "registerForm",
    errorId: "formError",
    submitBtnId: "submitBtn",
    apiUrl: "/api/auth/register",
    successRedirect: "/dashboard",
  });
</script>
{% endblock %}
