{% extends "base.html" %}
{% block title %}Party Budget Planner — PocketSmart AI{% endblock %}

{% block content %}
<div class="page-header">
  <h1>🎉 Party Budget Planner</h1>
  <p>Set the budget and guest count — get a categorized plan for the whole event.</p>
</div>

<div class="card form-card">
  <div class="form-error" id="formError" hidden></div>
  <form id="partyForm" class="form" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="budget">Total budget (₹) *</label>
        <input type="number" id="budget" name="budget" required min="1" step="100" placeholder="e.g. 30000" />
      </div>
      <div class="form-group">
        <label for="guest_count">Guest count *</label>
        <input type="number" id="guest_count" name="guest_count" required min="1" step="1" placeholder="e.g. 50" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="event_type">Event type *</label>
        <select id="event_type" name="event_type" required>
          <option value="">Select an event type</option>
          <option>Birthday</option>
          <option>Wedding</option>
          <option>Anniversary</option>
          <option>Corporate</option>
          <option>Festival</option>
          <option>Baby Shower</option>
          <option>Graduation</option>
        </select>
      </div>
      <div class="form-group">
        <label for="venue_preference">Venue preference *</label>
        <select id="venue_preference" name="venue_preference" required>
          <option value="">Select a venue</option>
          <option>Home</option>
          <option>Banquet Hall</option>
          <option>Outdoor / Lawn</option>
          <option>Restaurant</option>
          <option>Office</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="location">Location *</label>
      <input type="text" id="location" name="location" required placeholder="e.g. Mumbai" />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
      <span class="btn-label">Generate Party Plan</span>
      <span class="spinner" hidden></span>
    </button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  initPlannerForm({
    formId: "partyForm",
    errorId: "formError",
    submitBtnId: "submitBtn",
    apiUrl: "/api/planners/party",
    buildPayload: (fd) => ({
      budget: parseFloat(fd.get("budget")),
      guest_count: parseInt(fd.get("guest_count"), 10),
      event_type: fd.get("event_type"),
      venue_preference: fd.get("venue_preference"),
      location: fd.get("location"),
    }),
  });
</script>
{% endblock %}
