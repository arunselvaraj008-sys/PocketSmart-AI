{% extends "base.html" %}
{% block title %}Login — PocketSmart AI{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to access your saved plans and dashboard.</p>
    <div class="form-error" id="formError" hidden></div>
    <form id="loginForm" class="form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        <span class="btn-label">Log In</span>
        <span class="spinner" hidden></span>
      </button>
    </form>
    <p class="auth-alt">Don't have an account? <a href="/register">Register</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  initAuthForm({
    formId: "loginForm",
    errorId: "formError",
    submitBtnId: "submitBtn",
    apiUrl: "/api/auth/login",
    successRedirect: "/dashboard",
  });
</script>
{% endblock %}
